<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A3AA0"/>
      <stop offset="100%" stop-color="#3D2C8D"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9AA8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF9AA8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- hair tuft -->
  <path d="M256 118 C246 84 268 70 262 100 C280 78 300 92 284 114 C304 100 318 122 296 134 C312 132 316 154 292 156 C260 160 236 148 232 132 C226 124 236 122 256 118 Z" fill="#6E4226"/>

  <!-- face -->
  <circle cx="256" cy="270" r="128" fill="#FFC69A"/>

  <!-- ears -->
  <circle cx="126" cy="270" r="22" fill="#FFC69A"/>
  <circle cx="386" cy="270" r="22" fill="#FFC69A"/>

  <!-- blush cheeks -->
  <circle cx="182" cy="304" r="34" fill="url(#cheek)"/>
  <circle cx="330" cy="304" r="34" fill="url(#cheek)"/>

  <!-- eyes -->
  <ellipse cx="210" cy="256" rx="16" ry="20" fill="#3D2C8D"/>
  <ellipse cx="302" cy="256" rx="16" ry="20" fill="#3D2C8D"/>
  <circle cx="215" cy="248" r="5" fill="#fff"/>
  <circle cx="307" cy="248" r="5" fill="#fff"/>

  <!-- smile -->
  <path d="M222 312 Q256 340 290 312" stroke="#B5652F" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- pacifier -->
  <g transform="translate(256,368)">
    <circle cx="0" cy="0" r="30" fill="#FF6B9D"/>
    <circle cx="0" cy="0" r="16" fill="#FFDDE9"/>
    <rect x="-10" y="24" width="20" height="14" rx="7" fill="#C77DFF"/>
    <circle cx="0" cy="42" r="12" fill="#C77DFF"/>
  </g>
</svg>
